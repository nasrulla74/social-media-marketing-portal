services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@db:5432/${POSTGRES_DB:-portal}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: ${APP_ENV:-production}
      TELEGRAM_BRIDGE_TOKEN: ${TELEGRAM_BRIDGE_TOKEN:-change-me}
      DEFAULT_TELEGRAM_TEAM_ID: ${DEFAULT_TELEGRAM_TEAM_ID:-1}
      TELEGRAM_PUBLISH_BOT_TOKEN: ${TELEGRAM_PUBLISH_BOT_TOKEN:-}
      TELEGRAM_PUBLISH_CHAT_ID: ${TELEGRAM_PUBLISH_CHAT_ID:-}
      TWITTER_API_BEARER_TOKEN: ${TWITTER_API_BEARER_TOKEN:-}
      TWITTER_API_BASE_URL: ${TWITTER_API_BASE_URL:-https://api.x.com}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_AUTHOR_URN: ${LINKEDIN_AUTHOR_URN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_DEFAULT_IMAGE_URL: ${META_DEFAULT_IMAGE_URL:-}
      TIKTOK_PUBLISH_URL: ${TIKTOK_PUBLISH_URL:-}
      TIKTOK_PUBLISH_TOKEN: ${TIKTOK_PUBLISH_TOKEN:-}
      CUSTOM_PUBLISH_URL: ${CUSTOM_PUBLISH_URL:-}
      CUSTOM_PUBLISH_TOKEN: ${CUSTOM_PUBLISH_TOKEN:-}
      PUBLISH_WORKER_INTERVAL_SECONDS: ${PUBLISH_WORKER_INTERVAL_SECONDS:-15}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://smmp.api.appeul.com}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000', r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  portal_db:
